name: Deploy MarketLens Final Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render Power BI PDF pages with Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
          mkdir -p dist/assets/dashboard
          rm -f dist/assets/dashboard/page-*.png
          gs -dSAFER -dBATCH -dNOPAUSE \
            -sDEVICE=png16m \
            -r300 \
            -dTextAlphaBits=4 \
            -dGraphicsAlphaBits=4 \
            -dUseCropBox \
            -sOutputFile=dist/assets/dashboard/page-%d.png \
            dist/assets/final-market-dashboard.pdf
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for p in sorted(Path("dist/assets/dashboard").glob("page-*.png")):
              with p.open("rb") as f:
                  header = f.read(24)
              w, h = struct.unpack(">II", header[16:24])
              print(f"{p.name}: {w}x{h} px, {p.stat().st_size/1024/1024:.2f} MB")
          PY
          ls -lh dist/assets/dashboard/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
