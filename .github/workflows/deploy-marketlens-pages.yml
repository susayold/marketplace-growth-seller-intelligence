name: Deploy MarketLens Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'reports/tables/mart_marketplace_monthly.csv'
      - 'reports/tables/category_analysis_extended.csv'
      - 'reports/tables/mart_geography_performance.csv'
      - 'reports/tables/delivery_performance.csv'
      - 'reports/tables/seller_concentration.csv'
      - 'reports/tables/activation_summary.csv'
      - 'reports/qa/period_completeness.csv'
      - 'reports/headline_metrics.json'
      - 'reports/qa/statistical_validation.csv'
      - '.github/workflows/deploy-marketlens-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site with real aggregate data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data
          cp -R website/. _site/
          cp reports/tables/mart_marketplace_monthly.csv _site/data/
          cp reports/tables/category_analysis_extended.csv _site/data/
          cp reports/tables/mart_geography_performance.csv _site/data/
          cp reports/tables/delivery_performance.csv _site/data/
          cp reports/tables/seller_concentration.csv _site/data/
          cp reports/tables/activation_summary.csv _site/data/
          cp reports/qa/period_completeness.csv _site/data/
          cp reports/headline_metrics.json _site/data/
          cp reports/qa/statistical_validation.csv _site/data/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
